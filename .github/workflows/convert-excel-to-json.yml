name: Convert Excel to dashboard JSON

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**/*.xlsx"
      - "data/**/*.XLSX"
      - "data/**/*.xlsm"
      - "data/**/*.XLSM"
      - "data/**/*.xls"
      - "data/**/*.XLS"
      - "index.html"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "data/**/*.xlsx"
      - "data/**/*.XLSX"
      - "data/**/*.xlsm"
      - "data/**/*.XLSM"
      - "data/**/*.xls"
      - "data/**/*.XLS"
      - "index.html"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: excel-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run convert:data
      - run: npm run check:data
      - name: Commit generated JSON
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- data/manifest.json data/json-manifest.json data-json; then
            echo "No generated data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/json-manifest.json data-json
          git commit -m "data: update dashboard JSON"
          git push
